- type: bodyType
  id: ReptilianSlim
  name: body-slim
  sexRestrictions:
  - Male
  markingsDisplacement:
    Chest: &reptilianSlimMarkingTorso
      sizeMaps:
        32:
          sprite: _RW/Mobs/Species/Reptilian/displacement.rsi
          state: jumpsuit-female-slim
    LLeg: *reptilianSlimMarkingTorso
    RLeg: *reptilianSlimMarkingTorso
    Head: *reptilianSlimMarkingTorso
    Hair: *reptilianSlimMarkingTorso
    FacialHair: *reptilianSlimMarkingTorso
    LArm: *reptilianSlimMarkingTorso
    RArm: *reptilianSlimMarkingTorso
    LHand: *reptilianSlimMarkingTorso
    RHand: *reptilianSlimMarkingTorso
    LFoot: &reptilianSlimMarkingShoes
      sizeMaps:
        32:
          sprite: _RW/Mobs/Species/Reptilian/displacement.rsi
          state: shoes-slim
    RFoot: *reptilianSlimMarkingShoes
  sprites:
    Head: MobReptilianSlimHead
    Face: MobHumanoidAnyMarking
    Snout: MobHumanoidAnyMarking
    Chest: MobReptilianSlimTorso
    HeadTop: MobHumanoidAnyMarking
    HeadSide: MobHumanoidAnyMarking
    Tail: MobHumanoidAnyMarking
    Eyes: MobHumanoidEyes
    LArm: MobReptilianSlimLArm
    RArm: MobReptilianSlimRArm
    LHand: MobReptilianSlimLHand
    RHand: MobReptilianSlimRHand
    LLeg: MobReptilianSlimLLeg
    RLeg: MobReptilianSlimRLeg
    LFoot: MobReptilianSlimLFoot
    RFoot: MobReptilianSlimRFoot

